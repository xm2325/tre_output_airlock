name: Finalize v0.15 once

on:
  push:
    branches: [async-scan-worker-v0.15]
    paths:
      - ".finalize-v015-trigger"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: async-scan-worker-v0.15
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Finalize v0.15 docs and source versions
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          # Source release metadata. Lockfiles are refreshed in a separate native-tool step.
          Path("VERSION").write_text("0.15.0\n")
          version_py = Path("backend/app/version.py")
          text = version_py.read_text()
          text = re.sub(r'APP_VERSION\s*=\s*"[^"]+"', 'APP_VERSION = "0.15.0"', text)
          version_py.write_text(text)

          pyproject = Path("backend/pyproject.toml")
          text = pyproject.read_text()
          text = re.sub(r'(?m)^version = "[^"]+"$', 'version = "0.15.0"', text, count=1)
          pyproject.write_text(text)

          package = Path("frontend/package.json")
          data = json.loads(package.read_text())
          data["version"] = "0.15.0"
          package.write_text(json.dumps(data, indent=2) + "\n")

          # Environment contract.
          env_path = Path(".env.example")
          env = env_path.read_text()
          queue_block = '''\n# Asynchronous scan execution. Local/demo runs stay synchronous by default.\n# AWS reference tasks use queued mode with SQS, a transactional outbox publisher and workers.\n# AIRLOCK_SCAN_MODE=queued\n# AIRLOCK_SCAN_QUEUE_URL=https://sqs.eu-west-2.amazonaws.com/123456789012/airlock-scan\n# AIRLOCK_AWS_REGION=eu-west-2\n# AIRLOCK_SQS_ENDPOINT_URL=\n# AIRLOCK_OUTBOX_BATCH_SIZE=10\n# AIRLOCK_OUTBOX_CLAIM_TTL_SECONDS=30\n# AIRLOCK_SCAN_WORKER_CLAIM_TTL_SECONDS=60\n# AIRLOCK_SQS_WAIT_TIME_SECONDS=10\n# AIRLOCK_SQS_VISIBILITY_TIMEOUT_SECONDS=120\n'''
          if "# AIRLOCK_SCAN_MODE=queued" not in env:
              env = env.rstrip() + "\n" + queue_block
          env_path.write_text(env)

          # README targeted upgrades.
          readme_path = Path("README.md")
          readme = readme_path.read_text()
          readme = readme.replace(
              '| AWS backend service | Terraform for API Gateway, private ALB, ECS Fargate, RDS PostgreSQL, encrypted EFS, Secrets Manager, CloudWatch and constrained IAM roles; format/init/validate run in GitHub Actions |',
              '| AWS backend service | Terraform for API Gateway, private ALB, ECS Fargate API/publisher/worker roles, RDS PostgreSQL, encrypted EFS, SQS with DLQ/redrive, Secrets Manager, CloudWatch and least-privilege IAM; format/init/validate run in GitHub Actions |',
          )
          airlock_anchor = '- PostgreSQL, Alembic migrations and FastAPI;\n'
          async_bullets = '''- durable asynchronous scanning using PostgreSQL `ScanJob` + transactional `OutboxEvent`, an independent publisher and SQS consumer workers;\n- at-least-once delivery handling with expiring DB claims, retryable failures, DLQ/redrive infrastructure and duplicate-delivery suppression after durable completion;\n'''
          if async_bullets not in readme:
              readme = readme.replace(airlock_anchor, airlock_anchor + async_bullets, 1)

          old_arch = '''API Gateway HTTP API\n    -> VPC Link\n    -> internal ALB\n    -> private ECS Fargate tasks\n         -> private RDS PostgreSQL\n         -> encrypted EFS working-file volume\n         -> OAuth2/OIDC token introspection over HTTPS'''
          new_arch = '''API Gateway HTTP API\n    -> VPC Link\n    -> internal ALB\n    -> private ECS Fargate API tasks\n         -> private RDS PostgreSQL (submission + transactional outbox)\n         -> encrypted EFS working-file volume\n         -> OAuth2/OIDC token introspection over HTTPS\n\nIndependent ECS publisher -> committed outbox -> SQS scan queue -> ECS scan workers\n                                                     -> DLQ after redrive limit'''
          readme = readme.replace(old_arch, new_arch, 1)
          old_runtime = 'The application task role intentionally has no AWS control-plane permissions because the current FastAPI process does not call AWS APIs directly.'
          new_runtime = 'The API task role intentionally has no SQS permissions: uploads commit submission, job and outbox state to PostgreSQL only. A separate publisher role can only send to the scan queue, while the worker role is limited to SQS consume/acknowledgement operations. This keeps the database transaction as the durable hand-off boundary rather than performing a fragile DB-plus-SQS dual write in the request path.'
          readme = readme.replace(old_runtime, new_runtime, 1)

          readme = re.sub(
              r'- \*\*92 backend tests collected\*\*: \*\*90 passed \+ 2 PostgreSQL-only skipped\*\* on the standard SQLite backend job with \*\*90\.23% coverage\*\* against a 90% gate;',
              '- **108 backend tests collected**: **106 passed + 2 environment-specific skipped** on the standard SQLite backend job with **90.50% coverage** against a 90% gate;',
              readme,
          )
          readme = readme.replace(
              'The dedicated AWS backend-service workflow separately starts **PostgreSQL 16**, applies Alembic through **`0003(head)`**, verifies both cursor-pagination composite indexes in `pg_indexes`, and collects the same **92 tests**, with **91 passed + 1 SQLite-only skipped**.',
              'The dedicated AWS backend-service workflow separately starts **PostgreSQL 16**, applies Alembic through **`0004(head)`**, verifies the cursor-pagination composite indexes in `pg_indexes`, and runs the full backend contract against PostgreSQL.',
          )
          async_validation = '''- queued-upload API regression paths covering HTTP **202**, `QUEUED` state, atomic creation of one scan job plus one outbox event, exact idempotent replay without duplicate jobs, and payload-conflict **409**;\n- transactional-outbox/worker failure-window tests covering send-before-published-commit re-delivery, publisher send failure recovery, scan failure retry state, and message re-delivery after a durable completed scan without duplicated findings/audit;\n- a separate PostgreSQL 16 + Moto SQS-compatible integration gate that creates queue/DLQ state through boto3, publishes a committed outbox event over HTTP, consumes it through the production SQS adapter, persists the scan result, deletes the receipt only after commit, and deliberately replays the same payload to verify idempotent completion;\n'''
          validation_anchor = '- signed cursor regression paths covering three stable sort orders, equal-key tie-breaks, no duplicate/gap traversal, actor/filter binding, tamper rejection and bounded page size;\n'
          if async_validation not in readme:
              readme = readme.replace(validation_anchor, validation_anchor + async_validation, 1)
          boundary_anchor = 'Upload idempotency is actor-scoped and payload-bound inside the PostgreSQL transaction contract, but it is not a distributed exactly-once guarantee across regions or independent datastores.'
          boundary_replacement = boundary_anchor + ' Asynchronous scan delivery is likewise deliberately **at-least-once**, not exactly-once: the outbox publisher may resend after a crash between SQS acceptance and the `PUBLISHED` commit, and the worker may receive a message again after scan commit but before SQS deletion. Durable job state makes those duplicate deliveries safe within the demonstrated single-PostgreSQL contract.'
          readme = readme.replace(boundary_anchor, boundary_replacement, 1)
          readme_path.write_text(readme)

          # Production-readiness boundary.
          prod_path = Path("docs/production-readiness.md")
          prod = prod_path.read_text()
          prod = prod.replace(
              '| Processing | deterministic synchronous checks | isolated asynchronous workers, malware scan, parser timeouts, retries and workload resource limits |',
              '| Processing | synchronous local mode plus queued API mode, durable scan jobs, transactional outbox publisher, boto3 SQS transport, independent idempotent workers, expiring claims, retry-safe failures, SQS/DLQ Terraform and PostgreSQL+SQS-compatible CI | malware scanning, parser hard timeouts/resource isolation, applied AWS deployment, autoscaling/load tests, queue-age alarms and operational DLQ replay/runbook |',
          )
          prod = prod.replace(
              '| Delivery | CI, cross-stack release-version contract, dependency audits, PostgreSQL migration/pool contract, Terraform validation and container configuration |',
              '| Delivery | CI, cross-stack release-version contract, dependency audits, PostgreSQL migration/pool contract, Terraform validation, container configuration and an SQS-compatible committed-outbox-to-worker integration gate |',
          )
          async_section = '''\n## Asynchronous scan delivery boundary\n\nQueued execution uses PostgreSQL as the durable hand-off boundary. The upload request writes the submission, `ScanJob`, `OutboxEvent` and hash-linked `SCAN_QUEUED` audit state in one transaction and returns HTTP 202 without executing the disclosure checker. A separate publisher claims committed outbox rows and sends their versioned payload to SQS; independent workers receive messages, claim the matching durable job, execute the shared scanning application service, commit terminal database/audit state, and only then delete the SQS receipt.\n\nDelivery is intentionally **at-least-once**. If SQS accepts a message but the publisher crashes before marking the outbox row `PUBLISHED`, the expired outbox claim can be reclaimed and the payload sent again. If the worker commits a completed scan but crashes before deleting the SQS receipt, the message can also be delivered again. The worker checks the durable job state first, so a `COMPLETED` job is acknowledged without a second scan or duplicate completion audit. Failed scans return the job to `QUEUED`, record a bounded error/audit entry and leave the message undeleted so queue visibility/redrive policy can retry it.\n\nCI covers both deterministic failure windows and a separate PostgreSQL 16 plus Moto SQS-compatible HTTP integration using the production boto3 transport. The integration creates a queue and DLQ, publishes a committed outbox event, consumes and completes it, then deliberately re-sends the same payload and verifies no duplicate scan completion is persisted. Moto is used because recent LocalStack images require an external commercial auth token even for startup; no repository secret or live-AWS claim is introduced. Terraform separately validates real AWS SQS/DLQ/redrive resources and least-privilege publisher/worker IAM.\n\nThis is not a production exactly-once guarantee, a live AWS deployment, or evidence of queue throughput/latency under real load. Production still requires applied infrastructure, CloudWatch alarms for queue age/DLQ depth, autoscaling and back-pressure tests, poison-message/runbook validation, controlled DLQ replay, malware scanning and resource/time limits around untrusted parsers.\n'''
          if '## Asynchronous scan delivery boundary' not in prod:
              prod = prod.replace('\n## Release gates\n', async_section + '\n## Release gates\n', 1)
          prod = prod.replace(
              'A production release should require tests, cross-stack release-version consistency, PostgreSQL migration and connection-pool checks, dependency audit, synthetic benchmark, Terraform validation for infrastructure changes, security review for high-risk changes and a recorded policy approval when decision behaviour changes.',
              'A production release should require tests, cross-stack release-version consistency, PostgreSQL migration and connection-pool checks, asynchronous outbox/worker retry contracts when queue code changes, dependency audit, synthetic benchmark, Terraform validation for infrastructure changes, security review for high-risk changes and a recorded policy approval when decision behaviour changes.',
          )
          prod_path.write_text(prod)

          # Changelog: repository historically skipped intermediate release notes; record the current evidence release explicitly.
          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text()
          release_note = '''## 0.15.0 — 2026-08-24\n\n### Durable asynchronous scanning\n\n- Moved AWS-reference upload scanning out of the HTTP request path with a PostgreSQL transactional outbox, durable scan jobs and HTTP 202 queued submissions while keeping synchronous local/demo compatibility.\n- Added an independent outbox publisher and idempotent Python scan worker with expiring claims, retry-safe failure handling and duplicate-delivery suppression after durable completion.\n- Added a boto3 SQS transport plus encrypted SQS/DLQ/redrive Terraform, separate publisher/worker ECS services and least-privilege runtime IAM roles.\n- Added PostgreSQL 16 + SQS-compatible HTTP integration evidence from committed outbox through worker completion and deliberate duplicate replay.\n- Added Alembic revision `0004` for scan jobs/outbox persistence and routed create/recheck/worker execution through one scanning application service.\n- Expanded the backend contract to 108 collected tests; the standard job passes 106 with two environment-specific skips at 90.50% coverage, with Ruff, strict MyPy and dependency audit green.\n\n### Boundaries\n\n- Queue delivery is deliberately at-least-once, not exactly-once; durable job state makes the demonstrated crash-window redeliveries idempotent within the single-PostgreSQL contract.\n- The AWS stack remains a CI-validated Terraform reference, not a claimed live deployment.\n\n'''
          if '## 0.15.0' not in changelog:
              changelog = changelog.replace('# Changelog\n\n', '# Changelog\n\n' + release_note, 1)
          changelog_path.write_text(changelog)
          PY
          git diff --check
      - name: Commit v0.15 source release metadata and docs
        run: |
          rm -f .finalize-v015-trigger .github/workflows/finalize-v015-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "release: document and stage v0.15.0"
          git push origin HEAD:async-scan-worker-v0.15
