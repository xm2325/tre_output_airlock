name: Refresh v0.15 release locks once

on:
  push:
    branches: [async-scan-worker-v0.15]
    paths:
      - ".refresh-v015-release-locks-trigger"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: async-scan-worker-v0.15
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh native lock metadata
        run: |
          cd backend
          uv lock
          uv sync --frozen --all-extras
          cd ../frontend
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          cd ..
          git diff --check
      - name: Commit release locks
        run: |
          rm -f .refresh-v015-release-locks-trigger .github/workflows/refresh-v015-release-locks-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "release: refresh v0.15 lock metadata"
          git push origin HEAD:async-scan-worker-v0.15
