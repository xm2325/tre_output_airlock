name: Patch v0.15 scanning service once

on:
  push:
    branches: [async-scan-worker-v0.15]
    paths:
      - ".patch-v015-scanning-trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: async-scan-worker-v0.15
      - name: Route scans through application service
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/api/submission_routes.py')
          text = path.read_text()
          old_import = '''from app.api.common import (\n    _apply_automated_result,\n    _duplicate_finding,\n    _get_submission,\n    _request_id,\n)'''
          new_import = 'from app.api.common import _get_submission, _request_id'
          if old_import not in text:
              raise SystemExit('common import anchor missing')
          text = text.replace(old_import, new_import, 1)

          checker_import = 'from app.services.checker import ACTION_PRIORITY, OutputChecker, decision_from_findings\n'
          scanning_import = '''from app.services.scanning import (\n    ScanAuditContract,\n    ScanInputUnavailable,\n    run_submission_scan,\n)\n'''
          if scanning_import not in text:
              if checker_import not in text:
                  raise SystemExit('checker import anchor missing')
              text = text.replace(checker_import, checker_import + scanning_import, 1)

          create_anchor = text.index('async def create_submission')
          create_start = text.index('        submission.status = "SCANNING"', create_anchor)
          create_end = text.index('        db.add(submission)', create_start)
          create_replacement = '''        run_submission_scan(\n            db,\n            submission,\n            checker=checker,\n            request_id=_request_id(request),\n            path=stored.path,\n        )\n'''
          text = text[:create_start] + create_replacement + text[create_end:]

          recheck_anchor = text.index('def recheck_submission')
          path_start = text.index('    path = quarantined_path', recheck_anchor)
          commit_end = text.index('    db.commit()', path_start)
          recheck_replacement = '''    try:\n        run_submission_scan(\n            db,\n            submission,\n            checker=checker,\n            request_id=_request_id(request),\n            audit=ScanAuditContract(\n                started_event="RECHECK_STARTED",\n                started_actor=actor.name,\n                completed_event="AUTOMATED_RECHECK_COMPLETED",\n            ),\n        )\n    except ScanInputUnavailable as exc:\n        raise HTTPException(status_code=409, detail=str(exc)) from exc\n'''
          text = text[:path_start] + recheck_replacement + text[commit_end:]
          path.write_text(text)
          PY
          git diff --check
      - name: Commit refactor
        run: |
          rm -f .patch-v015-scanning-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor: route scans through application service"
          git push origin HEAD:async-scan-worker-v0.15
