name: Finalize v0.16 release once

on:
  push:
    branches: [async-operations-observability-v0.16]
    paths:
      - ".finalize-v016-trigger"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: async-operations-observability-v0.16
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Stage v0.16 documentation and source versions
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          Path("VERSION").write_text("0.16.0\n")
          replace("backend/app/version.py", '__version__ = "0.15.0"', '__version__ = "0.16.0"')
          replace("backend/pyproject.toml", 'version = "0.15.0"', 'version = "0.16.0"')

          package_path = Path("frontend/package.json")
          package = json.loads(package_path.read_text())
          if package.get("version") != "0.15.0":
              raise SystemExit(f"unexpected frontend version: {package.get('version')}")
          package["version"] = "0.16.0"
          package_path.write_text(json.dumps(package, indent=2) + "\n")

          replace(
              "README.md",
              "| AWS backend service | Terraform for API Gateway, private ALB, ECS Fargate API/publisher/worker roles, RDS PostgreSQL, encrypted EFS, SQS with DLQ/redrive, Secrets Manager, CloudWatch and least-privilege IAM; format/init/validate run in GitHub Actions |",
              "| AWS backend service | Terraform for API Gateway, private ALB, ECS Fargate API/publisher/worker roles, RDS PostgreSQL, encrypted EFS, SQS with DLQ/redrive, native CloudWatch backlog/oldest-age/DLQ alarms, Secrets Manager and least-privilege IAM; format/init/validate run in GitHub Actions |",
          )
          replace(
              "README.md",
              "- Prometheus-style HTTP, OIDC cache/single-flight, IdP latency and live PostgreSQL pool saturation/timeout metrics plus readiness checks;",
              "- Prometheus-style HTTP, OIDC cache/single-flight, IdP latency and live PostgreSQL pool saturation/timeout metrics plus a separate DB-backed async operations endpoint for durable backlog, stale leases, retries, completions and oldest-age state;",
          )
          replace(
              "README.md",
              "- telemetry: `http://localhost:8000/metrics`",
              "- core telemetry: `http://localhost:8000/metrics`\n- durable async operations telemetry: `http://localhost:8000/metrics/async`",
          )
          replace(
              "README.md",
              "- **108 backend tests collected**: **106 passed + 2 environment-specific skipped** on the standard SQLite backend job with **90.50% coverage** against a 90% gate;",
              "- **111 backend tests collected**: **109 passed + 2 environment-specific skipped** on the standard SQLite backend job with **90.76% coverage** against a 90% gate;",
          )
          replace(
              "README.md",
              "- transactional-outbox/worker failure-window tests covering send-before-published-commit re-delivery, publisher send failure recovery, scan failure retry state, and message re-delivery after a durable completed scan without duplicated findings/audit;",
              "- transactional-outbox/worker failure-window tests covering send-before-published-commit re-delivery, publisher send failure recovery, scan failure retry state, message re-delivery after a durable completed scan without duplicated findings/audit, and stale `PROCESSING` lease reclamation;\n- durable async operations tests covering pending/publishing/published outbox state, queued/processing/completed jobs, stale publisher/worker leases, retry state and oldest backlog age while preserving the DB-independent core `/metrics` endpoint;",
          )
          replace(
              "README.md",
              "The dedicated AWS backend-service workflow separately starts **PostgreSQL 16**, applies Alembic through **`0004(head)`**, verifies the cursor-pagination composite indexes in `pg_indexes`, and runs the full backend contract against PostgreSQL.",
              "The dedicated AWS backend-service workflow separately starts **PostgreSQL 16**, applies Alembic through **`0004(head)`**, verifies the cursor-pagination composite indexes in `pg_indexes`, and runs the full backend contract against PostgreSQL (**110 passed + 1 environment-specific skipped**).",
          )
          replace(
              "README.md",
              "Terraform format, `init -backend=false` and `validate` also run.",
              "Terraform format, `init -backend=false` and `validate` also cover native CloudWatch alarms for scan-queue backlog, oldest visible message age and DLQ depth.",
          )

          replace(
              "docs/production-readiness.md",
              "| Processing | synchronous local mode plus queued API mode, durable scan jobs, transactional outbox publisher, boto3 SQS transport, independent idempotent workers, expiring claims, retry-safe failures, SQS/DLQ Terraform and PostgreSQL+SQS-compatible CI | malware scanning, parser hard timeouts/resource isolation, applied AWS deployment, autoscaling/load tests, queue-age alarms and operational DLQ replay/runbook |",
              "| Processing | synchronous local mode plus queued API mode, durable scan jobs, transactional outbox publisher, boto3 SQS transport, independent idempotent workers, expiring claims, retry-safe failures, SQS/DLQ Terraform, stale-worker recovery and PostgreSQL+SQS-compatible CI | malware scanning, parser hard timeouts/resource isolation, applied AWS deployment, workload-calibrated autoscaling/back-pressure tests and controlled DLQ replay exercises |",
          )
          replace(
              "docs/production-readiness.md",
              "| Operations | database/storage readiness checks, Prometheus HTTP telemetry, OIDC cache/single-flight outcomes, IdP latency, live per-process PostgreSQL pool capacity/utilisation gauges and checkout-timeout counts | dashboards, service-level objectives, paging, aggregate RDS/ECS capacity alerts, dependency-specific alerts and incident response |",
              "| Operations | DB-independent core Prometheus telemetry, DB-backed durable async backlog/stale-lease/retry/completion/oldest-age metrics, OIDC/cache/IdP and PostgreSQL pool telemetry, plus native CloudWatch SQS backlog/oldest-age/DLQ alarms | production dashboards, service-level objectives, approved paging destinations, workload-calibrated thresholds, aggregate RDS/ECS capacity alerts and incident exercises |",
          )
          replace(
              "docs/production-readiness.md",
              "CI covers both deterministic failure windows and a separate PostgreSQL 16 plus Moto SQS-compatible HTTP integration using the production boto3 transport.",
              "CI covers both deterministic failure windows, stale-worker lease reclamation and a separate PostgreSQL 16 plus Moto SQS-compatible HTTP integration using the production boto3 transport.",
          )
          replace(
              "docs/production-readiness.md",
              "This is not a production exactly-once guarantee, a live AWS deployment, or evidence of queue throughput/latency under real load. Production still requires applied infrastructure, CloudWatch alarms for queue age/DLQ depth, autoscaling and back-pressure tests, poison-message/runbook validation, controlled DLQ replay, malware scanning and resource/time limits around untrusted parsers.",
              "The reference now also exposes durable PostgreSQL async state through `/metrics/async` and validates native CloudWatch alarms for SQS visible backlog, oldest-message age and DLQ depth; see [`async-scan-operations.md`](async-scan-operations.md) for signal interpretation and recovery steps. This is not a production exactly-once guarantee, a live AWS deployment, or evidence of queue throughput/latency under real load. Production still requires applied infrastructure, approved alert destinations and workload-calibrated thresholds, autoscaling/back-pressure tests, controlled DLQ replay exercises, malware scanning and resource/time limits around untrusted parsers.",
          )

          replace(
              "docs/async-scan-operations.md",
              "- `airlock_async_outbox_publishing`: events currently holding a publisher lease;",
              "- `airlock_async_outbox_publishing`: events currently holding a publisher lease;\n- `airlock_async_outbox_published`: durable events marked published;",
          )
          replace(
              "docs/async-scan-operations.md",
              "- `airlock_async_scan_processing`: durable jobs with an active worker lease;",
              "- `airlock_async_scan_processing`: durable jobs with an active worker lease;\n- `airlock_async_scan_completed`: durable jobs completed successfully;",
          )

          changelog = Path("CHANGELOG.md")
          current = changelog.read_text()
          if "## 0.16.0" in current:
              raise SystemExit("0.16.0 already present in changelog")
          entry = """# Changelog\n\n## 0.16.0 — 2026-08-24\n\n### Async operations and recovery\n\n- Added DB-backed `/metrics/async` gauges for durable outbox/job backlog, completion, retries, stale leases and oldest backlog age while preserving the DB-independent core metrics endpoint.\n- Added cross-SQLite/PostgreSQL stale-worker lease recovery coverage and explicit foreign-key-safe test fixtures.\n- Added native CloudWatch alarms for SQS visible backlog, oldest visible message age and DLQ depth without granting the API SQS permissions.\n- Added an async operations runbook covering alert interpretation, at-least-once failure windows, automatic lease recovery and controlled DLQ handling boundaries.\n- Kept alert thresholds explicitly illustrative rather than claiming production SLO calibration or live AWS operation.\n\n"""
          if not current.startswith("# Changelog\n\n"):
              raise SystemExit("unexpected changelog header")
          changelog.write_text(entry + current[len("# Changelog\n\n"):])
          PY
      - name: Refresh native release locks
        run: |
          cd backend
          uv lock
          uv sync --frozen --all-extras
          cd ../frontend
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          cd ..
      - name: Validate and commit release
        run: |
          rm -f .finalize-v016-trigger .github/workflows/finalize-v016-once.yml
          git diff --check
          python scripts/check_release_version.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "release: document and stage v0.16.0"
          git push origin HEAD:async-operations-observability-v0.16
