name: Apply verified repository patches

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: apply-verified-repository-patches
  cancel-in-progress: false

jobs:
  apply-v040:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/v040-synthetic-evaluation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v040-synthetic-evaluation
          fetch-depth: 0
      - name: Verify and apply the fixed patch
        run: |
          set -euo pipefail
          test -d .delivery/v040
          cat .delivery/v040/patch-* > "$RUNNER_TEMP/v040.patch.gz.b64"
          base64 --decode "$RUNNER_TEMP/v040.patch.gz.b64" > "$RUNNER_TEMP/v040.patch.gz"
          echo "61e8408d68e723a8eea64777e8a744312797516ca031ca03244253f69b10e135  $RUNNER_TEMP/v040.patch.gz" | sha256sum --check
          gzip --decompress --stdout "$RUNNER_TEMP/v040.patch.gz" > "$RUNNER_TEMP/v040.patch"
          git apply --binary -p4 "$RUNNER_TEMP/v040.patch"
      - name: Commit clean v0.4 source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .delivery/v040
          git add -A
          git commit -m "Implement v0.4 synthetic evaluation"
          git push origin HEAD:agent/v040-synthetic-evaluation

  finalize-v017:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release-v0.17.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-v0.17.0
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate v0.17 release metadata and native locks
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD_SHA"
          rm -f .delivery/v017-trigger
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          version = "0.17.0"
          Path("VERSION").write_text(version + "\n")

          p = Path("backend/app/version.py")
          text = p.read_text()
          if text.count('__version__ = "0.16.0"') != 1:
              raise SystemExit("unexpected backend runtime version source")
          p.write_text(text.replace('__version__ = "0.16.0"', '__version__ = "0.17.0"', 1))

          p = Path("backend/pyproject.toml")
          text = p.read_text()
          updated, count = re.subn(r'(?m)^version = "0\.16\.0"$', 'version = "0.17.0"', text, count=1)
          if count != 1:
              raise SystemExit("unexpected backend project version")
          p.write_text(updated)

          p = Path("frontend/package.json")
          data = json.loads(p.read_text())
          if data.get("version") != "0.16.0":
              raise SystemExit("unexpected frontend package version")
          data["version"] = version
          p.write_text(json.dumps(data, indent=2) + "\n")

          p = Path("CHANGELOG.md")
          text = p.read_text()
          if "## 0.17.0" in text:
              raise SystemExit("v0.17 changelog already exists")
          entry = '''## 0.17.0 — 2026-08-24

### Async request correlation and troubleshooting

- Promoted new asynchronous scan messages to schema v2 carrying the originating request/correlation ID from HTTP or a generated non-HTTP correlation value.
- Preserved rolling-deployment compatibility by continuing to consume legacy schema v1 queue messages that predate persisted request correlation.
- Propagated correlation into successful and failed worker audit events and structured worker logs with request, submission, job, outbox-event and disposition context.
- Extended retry and duplicate-delivery tests to prove the same correlation survives publisher redelivery, scan failure/retry and completed-message replay without duplicate completion audit.
- Extended the PostgreSQL 16 + SQS-compatible boto3 integration gate to verify committed outbox -> SQS -> worker -> correlated durable audit -> duplicate-safe replay.
- Expanded the backend contract to 115 collected tests: 113 passed with two environment-specific skips at 90.81% coverage on the standard job; PostgreSQL passes 114 with one environment-specific skip.

### Boundary

- This is application-level request correlation for troubleshooting, not a distributed-tracing, OpenTelemetry, AWS X-Ray or W3C `traceparent` implementation. Legacy v1 messages remain consumable but cannot reconstruct a request ID that was never persisted.

'''
          marker = "# Changelog\n\n"
          if not text.startswith(marker):
              raise SystemExit("unexpected changelog header")
          p.write_text(marker + entry + text[len(marker):])

          p = Path("README.md")
          text = p.read_text()
          replacements = [
              (
                  "| AWS backend service | Terraform for API Gateway, private ALB, ECS Fargate API/publisher/worker roles, RDS PostgreSQL, encrypted EFS, SQS with DLQ/redrive, native CloudWatch backlog/oldest-age/DLQ alarms, Secrets Manager and least-privilege IAM; format/init/validate run in GitHub Actions |",
                  "| AWS backend service | Terraform for API Gateway, private ALB, ECS Fargate API/publisher/worker roles, RDS PostgreSQL, encrypted EFS, SQS with DLQ/redrive, native CloudWatch backlog/oldest-age/DLQ alarms, Secrets Manager and least-privilege IAM; format/init/validate run in GitHub Actions |\n| Async troubleshooting | Versioned scan-message request correlation from HTTP/outbox through SQS workers into durable audit, structured request/submission/job/event/disposition logs, retry/duplicate preservation and legacy-v1 rolling-deployment compatibility |",
              ),
              (
                  "- at-least-once delivery handling with expiring DB claims, retryable failures, DLQ/redrive infrastructure and duplicate-delivery suppression after durable completion;",
                  "- at-least-once delivery handling with expiring DB claims, retryable failures, DLQ/redrive infrastructure and duplicate-delivery suppression after durable completion;\n- schema-v2 asynchronous request correlation from enqueue/outbox through worker success/failure audit and structured logs, while retaining schema-v1 consumer compatibility for rolling deployments;",
              ),
              (
                  "- **111 backend tests collected**: **109 passed + 2 environment-specific skipped** on the standard SQLite backend job with **90.76% coverage** against a 90% gate;",
                  "- **115 backend tests collected**: **113 passed + 2 environment-specific skipped** on the standard SQLite backend job with **90.81% coverage** against a 90% gate;",
              ),
              (
                  "- transactional-outbox/worker failure-window tests covering send-before-published-commit re-delivery, publisher send failure recovery, scan failure retry state, message re-delivery after a durable completed scan without duplicated findings/audit, and stale `PROCESSING` lease reclamation;",
                  "- transactional-outbox/worker failure-window tests covering send-before-published-commit re-delivery, publisher send failure recovery, scan failure retry state, message re-delivery after a durable completed scan without duplicated findings/audit, stale `PROCESSING` lease reclamation, and request-correlation preservation across retries/duplicate delivery;\n- versioned async message-contract tests covering schema-v2 request correlation plus legacy schema-v1 consumption during rolling deployment;",
              ),
              (
                  "publishes a committed outbox event over HTTP, consumes it through the production SQS adapter, persists the scan result, deletes the receipt only after commit, and deliberately replays the same payload to verify idempotent completion;",
                  "publishes a committed outbox event over HTTP, consumes it through the production SQS adapter, preserves one request correlation ID into the durable completion audit, deletes the receipt only after commit, and deliberately replays the same payload to verify idempotent completion;",
              ),
              (
                  "against PostgreSQL (**110 passed + 1 environment-specific skipped**).",
                  "against PostgreSQL (**114 passed + 1 environment-specific skipped**).",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"README expected one match, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)
          p.write_text(text)

          p = Path("docs/production-readiness.md")
          text = p.read_text()
          replacements = [
              (
                  "| Audit | request IDs, hash-linked events, signed reports and atomic review-claim/audit persistence | central append-only log, managed signing key, independent verification and recovery testing |",
                  "| Audit | request IDs, hash-linked events, signed reports, atomic review-claim/audit persistence and schema-v2 async request correlation into worker success/failure audit | central append-only log, managed signing key, independent verification and recovery testing |",
              ),
              (
                  "| Operations | DB-independent core Prometheus telemetry, DB-backed durable async backlog/stale-lease/retry/completion/oldest-age metrics, OIDC/cache/IdP and PostgreSQL pool telemetry, plus native CloudWatch SQS backlog/oldest-age/DLQ alarms |",
                  "| Operations | DB-independent core Prometheus telemetry, DB-backed durable async backlog/stale-lease/retry/completion/oldest-age metrics, correlated worker JSON logs carrying request/submission/job/event/disposition context, OIDC/cache/IdP and PostgreSQL pool telemetry, plus native CloudWatch SQS backlog/oldest-age/DLQ alarms |",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"production-readiness expected one match, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)
          marker = "Delivery is intentionally **at-least-once**."
          paragraph = "New queue payloads use schema v2 and carry the request/correlation ID that originated at the HTTP boundary, or a generated correlation value for non-HTTP enqueue paths. The worker propagates that value into successful and failed audit events and structured logs alongside submission, job, outbox event and processing disposition. Consumers continue to accept schema-v1 messages during rolling deployment; those legacy messages use `request_id=None` because a correlation value that was never persisted cannot be reconstructed. This is application-level troubleshooting correlation, not an OpenTelemetry, AWS X-Ray or W3C `traceparent` implementation.\n\n"
          if text.count(marker) != 1 or paragraph in text:
              raise SystemExit("unexpected async delivery documentation state")
          p.write_text(text.replace(marker, paragraph + marker, 1))
          PY

          cd backend
          uv lock
          uv sync --frozen --all-extras
          cd ../frontend
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          cd ..
          python scripts/check_release_version.py
          git diff --check

          python - <<'PY'
          import subprocess
          expected = {
              ".delivery/v017-trigger",
              "VERSION",
              "backend/app/version.py",
              "backend/pyproject.toml",
              "backend/uv.lock",
              "frontend/package.json",
              "frontend/package-lock.json",
              "CHANGELOG.md",
              "README.md",
              "docs/production-readiness.md",
          }
          actual = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f"unexpected release diff: {sorted(actual)}")
          PY

      - name: Commit v0.17 release metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: finalize v0.17.0 correlation evidence"
          git push origin HEAD:release-v0.17.0
