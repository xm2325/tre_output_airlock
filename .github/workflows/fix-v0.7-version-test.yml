name: Fix stale v0.7 version assertion once

on:
  push:
    branches: [release-contract-v0.7]
    paths:
      - ".github/workflows/fix-v0.7-version-test.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-contract-v0.7
      - name: Replace stale hard-coded health version
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/tests/test_api.py")
          text = path.read_text(encoding="utf-8")
          import_old = "from app.db import SessionLocal\nfrom app.models import AuditEvent\n"
          import_new = (
              "from app.core.policy import API_VERSION\n"
              "from app.db import SessionLocal\n"
              "from app.models import AuditEvent\n"
          )
          assertion_old = 'assert response.json()["version"] == "0.3.1"'
          assertion_new = 'assert response.json()["version"] == API_VERSION'
          if import_old not in text or assertion_old not in text:
              raise SystemExit("expected stale version assertion pattern not found")
          text = text.replace(import_old, import_new, 1)
          text = text.replace(assertion_old, assertion_new, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit exact test fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tests/test_api.py
          git diff --cached --check
          git commit -m "test: remove stale hard-coded API version"
          git push origin HEAD:release-contract-v0.7
