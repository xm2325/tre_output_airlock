name: Patch v0.15 scan service once

on:
  push:
    branches: [async-scan-worker-v0.15]
    paths:
      - ".scan-service-v015-trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: async-scan-worker-v0.15
      - name: Route synchronous scanning through application service
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/app/api/submission_routes.py")
          text = path.read_text()

          old_common = '''from app.api.common import (\n    _apply_automated_result,\n    _duplicate_finding,\n    _get_submission,\n    _request_id,\n)\n'''
          new_common = '''from app.api.common import _get_submission, _request_id\n'''
          if old_common not in text:
              raise SystemExit("common import anchor missing")
          text = text.replace(old_common, new_common, 1)

          import_anchor = '''from app.services.reports import build_report, verify_report\nfrom app.services.storage import FileTooLargeError, quarantined_path, store_quarantined_file\n'''
          import_replacement = '''from app.services.reports import build_report, verify_report\nfrom app.services.scanning import ScanAuditContract, ScanInputUnavailable, run_submission_scan\nfrom app.services.storage import FileTooLargeError, quarantined_path, store_quarantined_file\n'''
          if import_anchor not in text:
              raise SystemExit("service import anchor missing")
          text = text.replace(import_anchor, import_replacement, 1)

          create_old = '''        submission.status = "SCANNING"\n        append_audit_event(\n            submission,\n            "SCAN_STARTED",\n            "rule-engine",\n            f"Policy={POLICY_VERSION}; deterministic checks started.",\n            _request_id(request),\n        )\n\n        context = FileContext(\n            path=stored.path,\n            filename=safe_filename,\n            content_type=submission.content_type,\n            size_bytes=stored.size_bytes,\n        )\n        result = checker.check(context)\n        findings = list(result.findings)\n        duplicate = _duplicate_finding(db, submission_id, stored.sha256)\n        if duplicate is not None:\n            findings.append(duplicate)\n        _apply_automated_result(submission, findings, result.policy_version)\n        append_audit_event(\n            submission,\n            "AUTOMATED_CHECK_COMPLETED",\n            "rule-engine",\n            (\n                f"Policy={submission.policy_version}; decision={submission.automated_decision}; "\n                f"risk_score={submission.risk_score:.3f}; findings={len(findings)}."\n            ),\n            _request_id(request),\n        )\n'''
          create_new = '''        run_submission_scan(\n            db,\n            submission,\n            checker=checker,\n            request_id=_request_id(request),\n            path=stored.path,\n        )\n'''
          if create_old not in text:
              raise SystemExit("create scan block anchor missing")
          text = text.replace(create_old, create_new, 1)

          recheck_old = '''    path = quarantined_path(submission.id, submission.filename)\n    if submission.file_deleted_at is not None or not path.exists():\n        raise HTTPException(status_code=409, detail="Quarantined file is no longer available.")\n\n    submission.status = "SCANNING"\n    submission.claimed_by = None\n    submission.claimed_at = None\n    append_audit_event(\n        submission, "RECHECK_STARTED", actor.name, f"Policy={POLICY_VERSION}.", _request_id(request)\n    )\n    result = checker.check(\n        FileContext(\n            path=path,\n            filename=submission.filename,\n            content_type=submission.content_type,\n            size_bytes=submission.size_bytes,\n        )\n    )\n    findings = list(result.findings)\n    duplicate = _duplicate_finding(db, submission.id, submission.sha256)\n    if duplicate is not None:\n        findings.append(duplicate)\n    _apply_automated_result(submission, findings, result.policy_version)\n    append_audit_event(\n        submission,\n        "AUTOMATED_RECHECK_COMPLETED",\n        "rule-engine",\n        (\n            f"Policy={submission.policy_version}; "\n            f"decision={submission.automated_decision}; "\n            f"risk_score={submission.risk_score:.3f}; "\n            f"findings={len(findings)}."\n        ),\n        _request_id(request),\n    )\n'''
          recheck_new = '''    try:\n        run_submission_scan(\n            db,\n            submission,\n            checker=checker,\n            request_id=_request_id(request),\n            audit=ScanAuditContract(\n                started_event="RECHECK_STARTED",\n                started_actor=actor.name,\n                completed_event="AUTOMATED_RECHECK_COMPLETED",\n            ),\n        )\n    except ScanInputUnavailable as exc:\n        raise HTTPException(status_code=409, detail=str(exc)) from exc\n'''
          if recheck_old not in text:
              raise SystemExit("recheck scan block anchor missing")
          text = text.replace(recheck_old, recheck_new, 1)
          path.write_text(text)
          PY
          git diff --check
      - name: Commit scan-service routing
        run: |
          rm -f .scan-service-v015-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/api/submission_routes.py
          git diff --cached --quiet && exit 0
          git commit -m "refactor: route scans through application service"
          git push origin HEAD:async-scan-worker-v0.15
