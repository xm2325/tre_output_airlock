name: Finalize v0.17 release once

on:
  push:
    branches: [release-v0.17.0]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'chore: bootstrap v0.17 release finalizer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-v0.17.0
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Synchronise v0.17 release metadata and evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          Path("VERSION").write_text("0.17.0\n")
          replace_once("backend/app/version.py", '__version__ = "0.16.0"', '__version__ = "0.17.0"')
          replace_once("backend/pyproject.toml", 'version = "0.16.0"', 'version = "0.17.0"')
          replace_once(
              "backend/uv.lock",
              '[[package]]\nname = "tre-output-airlock-api"\nversion = "0.16.0"',
              '[[package]]\nname = "tre-output-airlock-api"\nversion = "0.17.0"',
          )

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text()
          marker = "# Changelog\n\n"
          if not text.startswith(marker):
              raise SystemExit("unexpected CHANGELOG header")
          section = """## 0.17.0 — 2026-08-24

### End-to-end asynchronous request correlation

- Propagated a sanitised/generated request ID from the HTTP request through the transactional outbox, versioned SQS message v2, worker structured logs and durable hash-linked audit evidence.
- Preserved the same correlation identifier across retry and duplicate-delivery paths while retaining compatibility with legacy v1 queue messages during rolling deployment.
- Added SQLite and PostgreSQL 16 + boto3/Moto regression evidence for correlation continuity without weakening the existing at-least-once/idempotent worker contract.
- Expanded the backend contract to 115 collected tests; the standard job passes 113 with two environment-specific skips at 90.81% coverage, while PostgreSQL passes 114 with one environment-specific skip.
- Kept the operational boundary explicit: this is application-level correlation evidence, not a claim of live AWS distributed tracing or production observability calibration.

"""
          changelog.write_text(marker + section + text[len(marker):])

          replace_once(
              "README.md",
              "- **111 backend tests collected**: **109 passed + 2 environment-specific skipped** on the standard SQLite backend job with **90.76% coverage** against a 90% gate;",
              "- **115 backend tests collected**: **113 passed + 2 environment-specific skipped** on the standard SQLite backend job with **90.81% coverage** against a 90% gate;",
          )
          replace_once(
              "README.md",
              "(**110 passed + 1 environment-specific skipped**)",
              "(**114 passed + 1 environment-specific skipped**)",
          )
          anchor = "- transactional-outbox/worker failure-window tests covering send-before-published-commit re-delivery, publisher send failure recovery, scan failure retry state, message re-delivery after a durable completed scan without duplicated findings/audit, and stale `PROCESSING` lease reclamation;\n"
          readme = Path("README.md")
          text = readme.read_text()
          if text.count(anchor) != 1:
              raise SystemExit("README async failure-window anchor missing or duplicated")
          correlation = "- end-to-end request-correlation regression paths covering inbound request-ID sanitisation/generation, transactional-outbox propagation, versioned SQS message v2, worker structured logs, durable audit persistence, retry/duplicate-delivery preservation and legacy v1 message compatibility;\n"
          readme.write_text(text.replace(anchor, anchor + correlation, 1))

          replace_once(
              "docs/production-readiness.md",
              "| Audit | request IDs, hash-linked events, signed reports and atomic review-claim/audit persistence | central append-only log, managed signing key, independent verification and recovery testing |",
              "| Audit | sanitised request IDs propagated through transactional outbox/SQS worker handling into structured logs and durable hash-linked events, plus signed reports and atomic review-claim/audit persistence | central append-only log, managed signing key, independent verification and recovery testing |",
          )
          PY

          cd frontend
          npm version 0.17.0 --no-git-tag-version --ignore-scripts
          cd ..

      - name: Prove frozen lock consistency
        shell: bash
        run: |
          python scripts/check_release_version.py
          cd backend
          uv sync --frozen --all-extras
          cd ../frontend
          npm ci --ignore-scripts

      - name: Commit release metadata and remove finalizer
        shell: bash
        run: |
          git config user.name "Xiaomei Mi"
          git config user.email "135629372+xm2325@users.noreply.github.com"
          git rm .github/workflows/release-v017-finalize.yml
          git add VERSION backend/app/version.py backend/pyproject.toml backend/uv.lock frontend/package.json frontend/package-lock.json CHANGELOG.md README.md docs/production-readiness.md
          git diff --cached --check
          git commit -m "chore: finalize v0.17.0 release metadata"
          git push origin HEAD:release-v0.17.0
