name: Prepare v0.12 release once

on:
  push:
    branches: [cursor-query-plan-v0.12]
    paths:
      - ".github/workflows/prepare-v0.12-release-once.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor-query-plan-v0.12
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Promote source metadata to 0.12.0
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Expected anchor missing in {path}: {old!r}")
              file.write_text(text.replace(old, new, 1))

          version = Path("VERSION")
          if version.read_text().strip() != "0.11.0":
              raise SystemExit("VERSION is not the expected 0.11.0 baseline")
          version.write_text("0.12.0\n")
          replace_once("backend/app/version.py", '__version__ = "0.11.0"', '__version__ = "0.12.0"')
          replace_once("backend/pyproject.toml", 'version = "0.11.0"', 'version = "0.12.0"')
          replace_once("frontend/package.json", '"version": "0.11.0"', '"version": "0.12.0"')
          PY
      - name: Refresh generated lock metadata
        run: |
          cd backend && uv lock
          cd ../frontend && npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Update v0.12 engineering evidence
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Expected anchor missing in {path}: {old[:160]!r}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "README.md",
              "| PostgreSQL / RDS | PostgreSQL-backed local stack, bounded per-task SQLAlchemy pool sizing/timeouts/recycling, live Prometheus pool saturation gauges, explicit 503 checkout-timeout handling, one-off migrations, and PostgreSQL 16 exhaustion/recovery CI |",
              "| PostgreSQL / RDS | PostgreSQL-backed local stack, bounded pool controls and telemetry, explicit 503 checkout-timeout handling, keyset composite indexes, and PostgreSQL 16 migration/exhaustion/query-plan contracts |",
          )
          replace_once(
              "README.md",
              "- signed cursor regression paths covering three stable sort orders, equal-key tie-breaks, no duplicate/gap traversal, actor/filter binding, tamper rejection and bounded page size;",
              "- signed cursor regression paths covering three stable sort orders, equal-key tie-breaks, no duplicate/gap traversal, actor/filter binding, tamper rejection and bounded page size;\n- PostgreSQL query-plan evidence that seeds 20,000 synthetic submissions, runs `ANALYZE`, and requires default-planner `EXPLAIN (FORMAT JSON)` plans for deep `newest` and `risk_desc` keyset queries to reference their corresponding composite cursor indexes;",
          )
          old_pg = "The dedicated AWS backend-service workflow separately starts **PostgreSQL 16**, applies Alembic through **`0002(head)`**, verifies both cursor-pagination composite indexes in `pg_indexes`, and collects the same **78 tests**, with **77 passed + 1 SQLite-only skipped**. Its pool contract still uses 3 persistent + 2 overflow connections, occupies all five, verifies live metrics report utilisation `1.0` and zero remaining capacity, checks `/ready` and a database-backed API return **503** under exhaustion, verifies the checkout-timeout counter increments, releases the held connections, then confirms utilisation returns to `0.0`, readiness recovers and `SELECT 1` succeeds. It also checks Terraform format, `init -backend=false` and `validate`. These checks validate code and configuration; they do not demonstrate a live AWS or real IdP deployment."
          new_pg = "The dedicated AWS backend-service workflow separately starts **PostgreSQL 16**, applies Alembic through **`0002(head)`**, verifies both cursor-pagination composite indexes in `pg_indexes`, and collects the same **78 tests**, with **77 passed + 1 SQLite-only skipped**. It also seeds **20,000 synthetic submissions**, runs `ANALYZE`, and checks default-planner `EXPLAIN (FORMAT JSON)` output for deep keyset queries: `newest` must use `ix_submissions_created_id` and `risk_desc` must use `ix_submissions_risk_cursor`. The complete plan JSON is retained as a CI artifact. Its pool contract still uses 3 persistent + 2 overflow connections and verifies saturation, explicit 503 behavior and recovery. Terraform format, `init -backend=false` and `validate` also run. These checks validate code, configuration and planner/index selection under the CI fixture; they do not demonstrate production latency, throughput, a live AWS deployment or a real IdP integration."
          replace_once("README.md", old_pg, new_pg)
          replace_once(
              "README.md",
              "Keyset cursors are stateless and avoid deep `OFFSET` scans, but they do not provide snapshot isolation:",
              "Keyset cursors are stateless and designed to avoid deep `OFFSET` scans. PostgreSQL CI confirms the intended composite indexes are selected by the default planner for a 20,000-row synthetic fixture, but that is query-plan evidence rather than a production performance benchmark. They also do not provide snapshot isolation:",
          )

          old_pagination = "Alembic revision `0002` adds `(created_at, id)` and `(risk_score DESC, created_at ASC, id ASC)` indexes. PostgreSQL 16 CI applies the real migration and verifies both indexes through `pg_indexes` before running the backend suite. This demonstrates the query/index contract, not production-scale latency. Representative-cardinality load tests and query-plan evidence are still required before making performance claims."
          new_pagination = "Alembic revision `0002` adds `(created_at, id)` and `(risk_score DESC, created_at ASC, id ASC)` indexes. PostgreSQL 16 CI applies the real migration and verifies both indexes through `pg_indexes`. A separate query-plan contract then inserts 20,000 synthetic submissions, runs `ANALYZE`, and executes default-planner `EXPLAIN (FORMAT JSON)` for deep `newest` and `risk_desc` keyset predicates. CI requires the former plan to reference `ix_submissions_created_id` and the latter to reference `ix_submissions_risk_cursor`, and retains the complete plan JSON as an artifact. This is repeatable planner/index-selection evidence, not a production latency or throughput benchmark; representative production cardinalities, data distributions, concurrent workload and RDS configuration still require validation."
          replace_once("docs/production-readiness.md", old_pagination, new_pagination)
          replace_once(
              "docs/production-readiness.md",
              "| Database | PostgreSQL Compose service, Alembic migrations, optimistic concurrency, bounded signed keyset submission pagination, composite cursor indexes, RDS-style configuration, bounded per-task SQLAlchemy pool settings, `pool_pre_ping`, checkout timeout/recycle controls, PostgreSQL 16 exhaustion/recovery testing and CI-validated RDS reference infrastructure | applied managed RDS environment, representative-cardinality pagination/load testing, backup/restore tests, least-privilege database roles, capacity calibration against the actual RDS connection limit and ECS task count, and failover testing |",
              "| Database | PostgreSQL Compose service, Alembic migrations, optimistic concurrency, bounded signed keyset pagination, composite cursor indexes, 20,000-row PostgreSQL default-planner query-plan contract, RDS-style configuration, bounded per-task pool settings, exhaustion/recovery testing and CI-validated RDS reference infrastructure | applied managed RDS environment, representative-cardinality and distribution load testing, query-plan validation against deployed statistics/configuration, backup/restore tests, least-privilege roles, capacity calibration and failover testing |",
          )
          PY
          git diff --check
      - name: Verify release version contract before commit
        run: python scripts/check_release_version.py
      - name: Commit generated release evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION backend/app/version.py backend/pyproject.toml backend/uv.lock frontend/package.json frontend/package-lock.json README.md docs/production-readiness.md
          git diff --cached --quiet && exit 0
          git commit -m "release: prepare v0.12 query-plan evidence"
          git push origin HEAD:cursor-query-plan-v0.12
