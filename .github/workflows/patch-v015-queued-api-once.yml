name: Patch v0.15 queued API once

on:
  push:
    branches: [async-scan-worker-v0.15]
    paths:
      - ".patch-v015-queued-api-trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: async-scan-worker-v0.15
      - name: Add queued submission execution mode
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/api/submission_routes.py')
          text = path.read_text()

          config_anchor = 'from app.core.config import settings\n'
          async_import = 'from app.core.async_scan import load_async_scan_settings\n'
          if async_import not in text:
              if config_anchor not in text:
                  raise SystemExit('config import anchor missing')
              text = text.replace(config_anchor, async_import + config_anchor, 1)

          scanning_anchor = '''from app.services.scanning import (\n    ScanAuditContract,\n    ScanInputUnavailable,\n    run_submission_scan,\n)\n'''
          enqueue_import = 'from app.services.scan_jobs import enqueue_scan\n'
          if enqueue_import not in text:
              if scanning_anchor not in text:
                  raise SystemExit('scanning import anchor missing')
              text = text.replace(scanning_anchor, enqueue_import + scanning_anchor, 1)

          raw_anchor = '''    else:\n        raw_key = None\n\n    normalised_project_code = project_code.strip()\n'''
          raw_replacement = '''    else:\n        raw_key = None\n\n    async_scan = load_async_scan_settings()\n    normalised_project_code = project_code.strip()\n'''
          if raw_anchor not in text:
              raise SystemExit('async settings anchor missing')
          text = text.replace(raw_anchor, raw_replacement, 1)

          replay_anchor = '''                response.headers["Idempotency-Replayed"] = "true"\n                response.headers["ETag"] = submission_etag(existing.id, existing.row_version)\n                return existing\n'''
          replay_replacement = '''                response.headers["Idempotency-Replayed"] = "true"\n                response.headers["ETag"] = submission_etag(existing.id, existing.row_version)\n                if async_scan.mode == "queued" and existing.status in {"QUEUED", "SCANNING"}:\n                    response.status_code = status.HTTP_202_ACCEPTED\n                return existing\n'''
          if replay_anchor not in text:
              raise SystemExit('existing replay anchor missing')
          text = text.replace(replay_anchor, replay_replacement, 1)

          scan_anchor = '''        run_submission_scan(\n            db,\n            submission,\n            checker=checker,\n            request_id=_request_id(request),\n            path=stored.path,\n        )\n        db.add(submission)\n        db.flush()\n'''
          scan_replacement = '''        db.add(submission)\n        db.flush()\n        if async_scan.mode == "queued":\n            enqueue_scan(db, submission, request_id=_request_id(request))\n        else:\n            run_submission_scan(\n                db,\n                submission,\n                checker=checker,\n                request_id=_request_id(request),\n                path=stored.path,\n            )\n'''
          if scan_anchor not in text:
              raise SystemExit('create scan anchor missing')
          text = text.replace(scan_anchor, scan_replacement, 1)

          race_anchor = '''            response.headers["Idempotency-Replayed"] = "true"\n            response.headers["ETag"] = submission_etag(replayed.id, replayed.row_version)\n            return replayed\n'''
          race_replacement = '''            response.headers["Idempotency-Replayed"] = "true"\n            response.headers["ETag"] = submission_etag(replayed.id, replayed.row_version)\n            if async_scan.mode == "queued" and replayed.status in {"QUEUED", "SCANNING"}:\n                response.status_code = status.HTTP_202_ACCEPTED\n            return replayed\n'''
          if race_anchor not in text:
              raise SystemExit('race replay anchor missing')
          text = text.replace(race_anchor, race_replacement, 1)

          fresh_anchor = '''    if raw_key is not None:\n        response.headers["Idempotency-Replayed"] = "false"\n    response.headers["ETag"] = submission_etag(latest.id, latest.row_version)\n'''
          fresh_replacement = '''    if raw_key is not None:\n        response.headers["Idempotency-Replayed"] = "false"\n    if async_scan.mode == "queued":\n        response.status_code = status.HTTP_202_ACCEPTED\n    response.headers["ETag"] = submission_etag(latest.id, latest.row_version)\n'''
          if fresh_anchor not in text:
              raise SystemExit('fresh response anchor missing')
          text = text.replace(fresh_anchor, fresh_replacement, 1)

          workflow_anchor = '''    workflow_status: Literal["AWAITING_REVIEW", "COMPLETED", "QUARANTINED", "SCANNING"]\n    | None = Query(default=None),\n'''
          workflow_replacement = '''    workflow_status: Literal[\n        "AWAITING_REVIEW", "COMPLETED", "QUARANTINED", "QUEUED", "SCANNING"\n    ] | None = Query(default=None),\n'''
          if workflow_anchor not in text:
              raise SystemExit('workflow status anchor missing')
          text = text.replace(workflow_anchor, workflow_replacement, 1)

          path.write_text(text)
          PY
          git diff --check
      - name: Commit queued API mode
        run: |
          rm -f .patch-v015-queued-api-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: enqueue uploads outside the request scan path"
          git push origin HEAD:async-scan-worker-v0.15
