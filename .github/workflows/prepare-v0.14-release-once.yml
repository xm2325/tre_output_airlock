name: Prepare v0.14 release once

on:
  push:
    branches: [upload-idempotency-v0.14]
    paths:
      - ".release-v014-trigger"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upload-idempotency-v0.14
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Update release metadata and evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          OLD = "0.13.0"
          NEW = "0.14.0"

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Expected anchor missing in {path}: {old[:160]!r}")
              file.write_text(text.replace(old, new, 1))

          version = Path("VERSION")
          if version.read_text().strip() != OLD:
              raise SystemExit("Unexpected baseline VERSION")
          version.write_text(NEW + "\n")

          replace_once("backend/app/version.py", OLD, NEW)
          replace_once("backend/pyproject.toml", f'version = "{OLD}"', f'version = "{NEW}"')

          package_path = Path("frontend/package.json")
          package = json.loads(package_path.read_text())
          if package.get("version") != OLD:
              raise SystemExit("Unexpected frontend package version")
          package["version"] = NEW
          package_path.write_text(json.dumps(package, indent=2) + "\n")

          replace_once(
              "README.md",
              "- **86 backend tests collected**: **85 passed + 1 PostgreSQL-only skipped** on the standard SQLite backend job with **90.62% coverage** against a 90% gate;",
              "- **92 backend tests collected**: **90 passed + 2 PostgreSQL-only skipped** on the standard SQLite backend job with **90.23% coverage** against a 90% gate;",
          )
          replace_once(
              "README.md",
              "- HTTP optimistic-concurrency regression paths covering current ETag publication, `If-Match`-only review, stale-header **412**, missing-precondition **428**, contradictory header/body **400**, weak/wildcard rejection, database CAS stale-write rejection and rollback of the decision when audit persistence fails;",
              "- HTTP optimistic-concurrency regression paths covering current ETag publication, `If-Match`-only review, stale-header **412**, missing-precondition **428**, contradictory header/body **400**, weak/wildcard rejection, database CAS stale-write rejection and rollback of the decision when audit persistence fails;\n- actor-scoped upload-idempotency regression paths covering exact replay, payload/metadata conflict **409**, cross-actor key reuse, raw-key non-persistence and a PostgreSQL barrier-forced concurrent first-request race that leaves one durable submission, one idempotency record and one quarantine file;",
          )
          replace_once(
              "README.md",
              "The dedicated AWS backend-service workflow separately starts **PostgreSQL 16**, applies Alembic through **`0002(head)`**, verifies both cursor-pagination composite indexes in `pg_indexes`, and collects the same **86 tests**, with **85 passed + 1 SQLite-only skipped**.",
              "The dedicated AWS backend-service workflow separately starts **PostgreSQL 16**, applies Alembic through **`0003(head)`**, verifies both cursor-pagination composite indexes in `pg_indexes`, and collects the same **92 tests**, with **91 passed + 1 SQLite-only skipped**.",
          )
          replace_once(
              "README.md",
              "Submission ETags likewise represent the current mutable row version for conditional writes; they are not database locks, snapshot tokens or cross-request transactions. A real service would still require",
              "Submission ETags likewise represent the current mutable row version for conditional writes; they are not database locks, snapshot tokens or cross-request transactions. Upload idempotency is actor-scoped and payload-bound inside the PostgreSQL transaction contract, but it is not a distributed exactly-once guarantee across regions or independent datastores. A real service would still require",
          )

          replace_once(
              "docs/production-readiness.md",
              "| Review concurrency | strong id/version ETags, `If-Match` plus legacy expected-version compatibility, database compare-and-swap for claim and final review writes, transactional decision/audit persistence and expiring review-claim lease | representative multi-instance load/concurrency testing, client retry/precondition UX validation and operational tuning of the lease duration |",
              "| Review concurrency | strong id/version ETags, `If-Match` plus legacy expected-version compatibility, database compare-and-swap for claim and final review writes, transactional decision/audit persistence and expiring review-claim lease | representative multi-instance load/concurrency testing, client retry/precondition UX validation and operational tuning of the lease duration |\n| Upload idempotency | actor-scoped hashed keys, payload fingerprints, PostgreSQL unique-race recovery, legacy-key migration and staged-file cleanup on replay/conflict/failure | distributed/multi-region retry semantics, durable object-store reconciliation and representative concurrent client testing beyond the CI fixture |",
          )
          replace_once(
              "docs/production-readiness.md",
              "## Submission pagination boundary",
              "## Upload idempotency boundary\n\n`Idempotency-Key` is scoped to the authenticated actor through a SHA-256 digest rather than stored as a new raw submission key. A request fingerprint binds normalized submission metadata to filename, content type, byte count and file SHA-256. Reusing the same actor/key with an identical payload returns the existing submission; changing the payload or metadata returns 409. Different actors may independently reuse the same original key.\n\nAlembic revision `0003` introduces the durable idempotency-record table and backfills legacy keyed submissions. The PostgreSQL-only concurrency regression forces two first requests past the initial lookup together. The unique scope key selects one database winner; the losing transaction rolls back its flushed submission/audit state, removes its staged quarantine file and replays the committed winner. CI verifies one durable submission, one idempotency record and one resulting quarantine file. This is retry/idempotency evidence for the single PostgreSQL-backed service contract, not a claim of distributed exactly-once execution. Database state and filesystem/object storage are not one distributed transaction, so production storage still requires reconciliation and orphan-cleanup controls.\n\n## Submission pagination boundary",
          )
          PY
      - name: Refresh native lockfiles
        run: |
          cd backend
          uv lock
          cd ../frontend
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate release contract
        run: |
          python scripts/check_release_version.py
          git diff --check
      - name: Commit release preparation
        run: |
          rm -f .release-v014-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "release: prepare v0.14.0"
          git push origin HEAD:upload-idempotency-v0.14
