name: Fix v0.15 imports once

on:
  push:
    branches: [async-scan-worker-v0.15]
    paths:
      - ".fix-v015-imports-trigger"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: async-scan-worker-v0.15
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          cd backend
          uv sync --frozen --all-extras
          uv run ruff check app/api/submission_routes.py --fix
          uv run ruff check app/api/submission_routes.py
          cd ..
          git diff --check
      - name: Commit import ordering
        run: |
          rm -f .fix-v015-imports-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "style: normalize v0.15 route imports"
          git push origin HEAD:async-scan-worker-v0.15
