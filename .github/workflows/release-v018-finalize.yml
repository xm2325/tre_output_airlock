name: Finalize v0.18 release

on:
  push:
    branches: [scan-lease-fencing-v0.18]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'chore: trigger v0.18 finalizer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scan-lease-fencing-v0.18
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate and validate v0.18 release
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "0.17.0"
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one anchor in {path}: {old!r}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          Path("VERSION").write_text("0.18.0\n", encoding="utf-8")
          replace_once(
              "backend/app/version.py",
              '__version__ = "0.17.0"',
              '__version__ = "0.18.0"',
          )
          replace_once(
              "backend/pyproject.toml",
              'version = "0.17.0"',
              'version = "0.18.0"',
          )

          changelog = Path("CHANGELOG.md")
          changelog_text = changelog.read_text(encoding="utf-8")
          release_notes = """## 0.18.0 — 2026-08-24

          ### Long-running scan ownership fencing

          - Added a per-attempt UUID `claim_token` to durable scan jobs through Alembic revision `0005`.
          - Added token-guarded PostgreSQL lease heartbeats and SQS `ChangeMessageVisibility` renewal for long-running asynchronous scans.
          - Guarded terminal success and failure/requeue writes by the current claim token so a stale worker cannot commit findings, audit state or retry state after ownership changes.
          - Kept active duplicate deliveries unacknowledged while another worker owns a live lease, preserving a recoverable message if the active worker later fails.
          - Added PostgreSQL-only evidence that changes ownership during an in-flight scan and verifies the stale transaction rolls back its pending scan audit/results.
          - Expanded the backend contract to 122 collected tests: 119 passed with three environment-specific skips at 90.16% coverage on the standard job; PostgreSQL passes 121 with one environment-specific skip.

          ### Boundary

          - Heartbeats reduce avoidable redelivery but are not the correctness mechanism. Claim-token conditional writes fence stale workers. Delivery remains at-least-once, not distributed exactly-once, and SQS visibility renewal failure can still cause duplicate delivery.

          """
          marker = "# Changelog\n\n"
          if not changelog_text.startswith(marker):
              raise SystemExit("CHANGELOG header anchor missing")
          changelog.write_text(
              marker + release_notes + changelog_text[len(marker):],
              encoding="utf-8",
          )

          async_row = (
              "| Async troubleshooting | Versioned scan-message request correlation from HTTP/outbox through SQS workers into durable audit, structured request/submission/job/event/disposition logs, retry/duplicate preservation and legacy-v1 rolling-deployment compatibility |"
          )
          replace_once(
              "README.md",
              async_row,
              async_row
              + "\n| Async worker reliability | Per-attempt UUID claim tokens, token-guarded PostgreSQL lease renewal, SQS visibility heartbeats, stale-success/failure fencing and active-duplicate non-acknowledgement for long-running scans |",
          )
          replace_once(
              "README.md",
              "- at-least-once delivery handling with expiring DB claims, retryable failures, DLQ/redrive infrastructure and duplicate-delivery suppression after durable completion;",
              "- at-least-once delivery handling with per-attempt claim-token fencing, token-guarded DB heartbeats, SQS visibility renewal, retryable failures, DLQ/redrive infrastructure and duplicate-delivery suppression after durable completion;",
          )
          replace_once(
              "README.md",
              "- **115 backend tests collected**: **113 passed + 2 environment-specific skipped** on the standard SQLite backend job with **90.81% coverage** against a 90% gate;",
              "- **122 backend tests collected**: **119 passed + 3 environment-specific skipped** on the standard SQLite backend job with **90.16% coverage** against a 90% gate;",
          )
          replace_once(
              "README.md",
              "- transactional-outbox/worker failure-window tests covering send-before-published-commit re-delivery, publisher send failure recovery, scan failure retry state, message re-delivery after a durable completed scan without duplicated findings/audit, stale `PROCESSING` lease reclamation, and request-correlation preservation across retries/duplicate delivery;",
              "- transactional-outbox/worker failure-window tests covering send-before-published-commit re-delivery, publisher send failure recovery, scan failure retry state, message re-delivery after a durable completed scan without duplicated findings/audit, stale `PROCESSING` lease reclamation, claim-token heartbeat/fencing, active-duplicate non-acknowledgement, and request-correlation preservation across retries/duplicate delivery;",
          )
          replace_once(
              "README.md",
              "applies Alembic through **`0004(head)`**",
              "applies Alembic through **`0005(head)`**",
          )
          replace_once(
              "README.md",
              "(**114 passed + 1 environment-specific skipped**)",
              "(**121 passed + 1 environment-specific skipped**)",
          )

          processing_old = "| Processing | synchronous local mode plus queued API mode, durable scan jobs, transactional outbox publisher, boto3 SQS transport, independent idempotent workers, expiring claims, retry-safe failures, SQS/DLQ Terraform, stale-worker recovery and PostgreSQL+SQS-compatible CI | malware scanning, parser hard timeouts/resource isolation, applied AWS deployment, workload-calibrated autoscaling/back-pressure tests and controlled DLQ replay exercises |"
          processing_new = "| Processing | synchronous local mode plus queued API mode, durable scan jobs, transactional outbox publisher, boto3 SQS transport, independent idempotent workers, per-attempt claim-token fencing, token-guarded DB heartbeats, SQS visibility renewal, retry-safe failures, SQS/DLQ Terraform and PostgreSQL+SQS-compatible CI | malware scanning, parser hard timeouts/resource isolation, applied AWS deployment, workload-calibrated autoscaling/back-pressure tests and controlled DLQ replay exercises |"
          replace_once("docs/production-readiness.md", processing_old, processing_new)

          delivery_anchor = "Failed scans return the job to `QUEUED`, record a bounded error/audit entry and leave the message undeleted so queue visibility/redrive policy can retry it.\n\nCI covers"
          lease_boundary = "Failed scans return the job to `QUEUED`, record a bounded error/audit entry and leave the message undeleted so queue visibility/redrive policy can retry it.\n\nLong-running workers use a fresh per-attempt UUID claim token. A background heartbeat renews `claimed_at` with a token-guarded database update and, only while durable ownership remains current, renews SQS visibility through `ChangeMessageVisibility`. Heartbeat timing is not the correctness mechanism: terminal success and failure/requeue writes are also conditional on the current claim token. If ownership changes during a scan, the stale transaction rolls back pending findings/audit instead of committing them. An active duplicate delivery is not acknowledged while another worker holds a live lease. Visibility renewal failure can therefore cause another delivery, but it cannot authorise a stale database write.\n\nCI covers"
          replace_once("docs/production-readiness.md", delivery_anchor, lease_boundary)
          replace_once(
              "docs/production-readiness.md",
              "CI covers both deterministic failure windows, stale-worker lease reclamation and a separate PostgreSQL 16 plus Moto SQS-compatible HTTP integration using the production boto3 transport.",
              "CI covers both deterministic failure windows, stale-worker lease reclamation, token renewal/loss, active-duplicate non-acknowledgement and PostgreSQL-only stale-worker fencing, plus a separate PostgreSQL 16 and Moto SQS-compatible HTTP integration using the production boto3 transport.",
          )
          PY

          cd backend
          uv lock
          uv sync --frozen --all-extras
          cd ../frontend
          npm version 0.18.0 --no-git-tag-version
          npm ci
          cd ..
          python scripts/check_release_version.py

          rm -f .github/workflows/release-v018-finalize.yml .delivery/v018-trigger
          git add -A
          python - <<'PY'
          import subprocess

          expected = {
              ".delivery/v018-trigger",
              ".github/workflows/release-v018-finalize.yml",
              "CHANGELOG.md",
              "README.md",
              "VERSION",
              "backend/app/version.py",
              "backend/pyproject.toml",
              "backend/uv.lock",
              "docs/production-readiness.md",
              "frontend/package-lock.json",
              "frontend/package.json",
          }
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--cached", "--name-only"], text=True
              ).splitlines()
          )
          if changed != expected:
              raise SystemExit(
                  "unexpected v0.18 release diff: "
                  f"missing={sorted(expected - changed)} extra={sorted(changed - expected)}"
              )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "release: finalize v0.18.0 scan lease fencing"
          git push origin HEAD:scan-lease-fencing-v0.18
