name: Refresh v0.15 uv lock once

on:
  push:
    branches: [async-scan-worker-v0.15]
    paths:
      - ".refresh-v015-uv-lock-trigger"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: async-scan-worker-v0.15
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh native Python lockfile
        run: |
          cd backend
          uv lock
          uv sync --frozen --all-extras
          cd ..
          git diff --check
      - name: Commit lock metadata
        run: |
          rm -f .refresh-v015-uv-lock-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/uv.lock
          git diff --cached --quiet && exit 0
          git commit -m "build: refresh v0.15 Python lock metadata"
          git push origin HEAD:async-scan-worker-v0.15
