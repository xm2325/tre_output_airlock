name: AWS backend service

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "scripts/check_postgres_cursor_plans.py"
      - "infra/aws/backend_service/**"
      - "docs/identity-and-backend-platform.md"
      - ".github/workflows/backend-service.yml"
  pull_request:
    paths:
      - "backend/**"
      - "scripts/check_postgres_cursor_plans.py"
      - "infra/aws/backend_service/**"
      - "docs/identity-and-backend-platform.md"
      - ".github/workflows/backend-service.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-backend-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/aws/backend_service
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - run: terraform fmt -check -diff -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  backend-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check app tests alembic ../scripts/check_postgres_cursor_plans.py
      - run: uv run mypy app
      - run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=90
      - name: Verify entrypoint syntax
        run: sh -n entrypoint.sh

  postgres-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: airlock_test
          POSTGRES_USER: airlock
          POSTGRES_PASSWORD: airlock-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U airlock -d airlock_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIRLOCK_DATABASE_URL: postgresql+psycopg://airlock:airlock-test@127.0.0.1:5432/airlock_test
      AIRLOCK_DATABASE_POOL_SIZE: "3"
      AIRLOCK_DATABASE_MAX_OVERFLOW: "2"
      AIRLOCK_DATABASE_POOL_TIMEOUT_SECONDS: "0.2"
      AIRLOCK_DATABASE_POOL_RECYCLE_SECONDS: "300"
      AIRLOCK_QUARANTINE_DIR: /tmp/airlock-postgres-quarantine
      AIRLOCK_AUTO_CREATE_SCHEMA: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-extras
      - name: Apply Alembic migration to PostgreSQL
        run: |
          uv run alembic upgrade head
          test "$(uv run alembic current | tr -d '[:space:]')" = "0005(head)"
      - name: Verify cursor pagination indexes
        run: |
          uv run python - <<'PY'
          import os

          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["AIRLOCK_DATABASE_URL"])
          with engine.connect() as connection:
              rows = connection.execute(
                  text(
                      """
                      SELECT indexname, indexdef
                      FROM pg_indexes
                      WHERE schemaname = 'public'
                        AND tablename = 'submissions'
                        AND indexname IN (
                          'ix_submissions_created_id',
                          'ix_submissions_risk_cursor'
                        )
                      ORDER BY indexname
                      """
                  )
              ).all()
          definitions = {name: definition for name, definition in rows}
          assert set(definitions) == {
              "ix_submissions_created_id",
              "ix_submissions_risk_cursor",
          }, definitions
          assert "created_at, id" in definitions["ix_submissions_created_id"]
          risk_definition = definitions["ix_submissions_risk_cursor"]
          assert "risk_score DESC" in risk_definition
          assert "created_at" in risk_definition and "id" in risk_definition
          print("cursor pagination indexes verified")
          PY
      - name: Verify cursor query plans
        id: cursor_query_plans
        run: >-
          uv run python ../scripts/check_postgres_cursor_plans.py
          --rows 20000
          --output "$RUNNER_TEMP/cursor-query-plans.json"
      - name: Upload cursor query-plan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cursor-query-plan-evidence
          path: ${{ runner.temp }}/cursor-query-plans.json
          if-no-files-found: warn
      - name: Run backend suite against PostgreSQL
        run: uv run pytest -q
