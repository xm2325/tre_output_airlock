name: Finalize v0.18 release

on:
  push:
    branches: [scan-lease-fencing-v0.18]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'chore: trigger v0.18 finalizer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scan-lease-fencing-v0.18
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Finalize release metadata and native locks
        run: bash .delivery/finalize-v018.sh
